services:
  - type: web
    name: currency-atm
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ADMIN_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CHAT_PROVIDER
        value: gemini
      - key: CHAT_MODEL
        value: gemini-3.8-flash
      - key: CHAT_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
